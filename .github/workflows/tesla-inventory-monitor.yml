name: Tesla inventory monitor

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Scheduled runs can lag by a few
    # minutes under load; that is normal for GitHub Actions.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Search and print only; send no email"
        type: boolean
        default: false
      test_email:
        description: "Send a test email to EMAIL_TO and stop"
        type: boolean
        default: false

# Only one run at a time, so two overlapping runs never double-email.
concurrency:
  group: tesla-inventory-monitor
  cancel-in-progress: false

permissions:
  contents: write   # to commit the seen-VIN state back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Test email
        if: ${{ inputs.test_email }}
        run: python3 tools/tesla-monitor/tesla_monitor.py --test-email

      - name: Check Tesla inventory
        if: ${{ !inputs.test_email }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/tesla-monitor/tesla_monitor.py --dry-run
          else
            python3 tools/tesla-monitor/tesla_monitor.py
          fi

      - name: Remember what we have already announced
        if: ${{ !cancelled() && !inputs.test_email && !inputs.dry_run }}
        run: |
          git config user.name  "tesla-monitor[bot]"
          git config user.email "tesla-monitor@users.noreply.github.com"
          git add tools/tesla-monitor/state/seen.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "tesla-monitor: record newly seen VINs [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
